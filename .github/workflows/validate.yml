name: Validate scientific implementation
on: [push, pull_request]
jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[test]'
      - run: mkdir -p work
      - run: python -m pytest tests -q --basetemp work/ci-tests
      - run: python -m horsehair.cli --config configs/study.json validate-config

